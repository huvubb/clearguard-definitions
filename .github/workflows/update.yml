name: Update definitions

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify upstream bloom filter
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o data/sha256-bloom.bin \
            https://github.com/MaintainTeam/HypatiaDatabases/raw/gh-pages/hypatia-sha256-bloom.bin
          curl --fail --location --retry 3 -o data/sha256-bloom.bin.sig \
            https://github.com/MaintainTeam/HypatiaDatabases/raw/gh-pages/hypatia-sha256-bloom.bin.sig
          gpg --batch --import trusted-signing.key
          gpg --batch --verify data/sha256-bloom.bin.sig data/sha256-bloom.bin

      - name: Update manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          data = Path('data/sha256-bloom.bin').read_bytes()
          manifest_path = Path('data/manifest.json')
          manifest = json.loads(manifest_path.read_text())
          entry = manifest['files']['sha256-bloom.bin']
          digest = hashlib.sha256(data).hexdigest()
          if entry['sha256'] == digest and entry['size'] == len(data):
              print('Database is unchanged.')
          else:
              entry['sha256'] = digest
              entry['size'] = len(data)
              manifest['generated_at'] = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
              manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add data/
            git commit -m "Update verified definitions"
            git push
          else
            echo 'No changes.'
          fi
