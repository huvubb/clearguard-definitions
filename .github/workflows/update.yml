name: Update definitions

on:
  schedule:
    - cron: '0 3 * * 0'  # weekly Sunday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download upstream bloom filter
        run: |
          set -e
          curl -sSL -o data/sha256-bloom.bin \
            https://github.com/MaintainTeam/HypatiaDatabases/raw/gh-pages/hypatia-sha256-bloom.bin
          curl -sSL -o data/sha256-bloom.bin.sig \
            https://github.com/MaintainTeam/HypatiaDatabases/raw/gh-pages/hypatia-sha256-bloom.bin.sig
          sha256sum data/sha256-bloom.bin

      - name: Update manifest timestamp and hash
        run: |
          set -e
          HASH=$(sha256sum data/sha256-bloom.bin | cut -d' ' -f1)
          SIZE=$(stat -c%s data/sha256-bloom.bin)
          TODAY=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 -c "
import json
m = json.load(open('data/manifest.json'))
m['generated_at'] = '$TODAY'
m['files']['sha256-bloom.bin']['sha256'] = '$HASH'
m['files']['sha256-bloom.bin']['size'] = $SIZE
json.dump(m, open('data/manifest.json','w'), indent=2)
"

      - name: Commit and push if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add data/
            git commit -m "Update definitions: $TODAY"
            git push
          else
            echo "No changes."
          fi
